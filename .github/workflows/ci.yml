name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  teste:
    name: Teste automate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalează Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalează dependențele de test
        run: python -m pip install --upgrade pip pytest

      # Testele nu au nevoie de model local: agenții sunt rulați cu un LLM fals,
      # exact ca să putem verifica în CI ce se întâmplă când modelul lipsește.
      - name: Rulează testele
        run: python -m pytest -v

  lint-renpy:
    name: Verificare script Ren'Py
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verifică sintaxa fișierelor Python din joc
        run: |
          python -m compileall -q game/python-packages
          echo "Pachetele Python ale jocului compilează."

      # Lint-ul complet Ren'Py cere SDK-ul (~400MB) și un display virtual.
      # Îl rulăm local înainte de fiecare PR:
      #   /cale/catre/renpy-8.5.2-sdk/renpy.sh . lint
      - name: Reamintește lint-ul Ren'Py
        run: echo "Rulează local 'renpy.sh . lint' înainte de merge."
